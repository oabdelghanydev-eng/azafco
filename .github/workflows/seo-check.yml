name: SEO check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: seo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run seo:check
